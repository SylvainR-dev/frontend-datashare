# Le fichier de configuration Nginx détermine exactement comment le serveur va réagir aux requêtes.
# Tu y définis le port, quels fichiers servir, comment les compresser, et comment gérer les routes, par exemple en renvoyant certaines requêtes vers ton backend.
# Donc, c'est bien un calibrage, mais très complet, pour que ton application fonctionne comme prévu


# ================================
# Bloc 1 : Redirection HTTP → HTTPS
# ================================
# Tout le trafic HTTP (port 80) est automatiquement redirigé vers HTTPS (port 443)
# Le code 301 indique une redirection permanente, ce qui permet aux navigateurs et moteurs de recherche de mémoriser la redirection
# Sans ce bloc, les utilisateurs qui tapent "http://" auraient une connexion non sécurisée

server {
    listen 80;
    server_name serveronfire.dev www.serveronfire.dev;

    # Redirection permanente vers HTTPS
    return 301 https://$host$request_uri;
}


# ================================
# Bloc 2 : Serveur HTTPS principal
# ================================
# Ce bloc gère toutes les requêtes sécurisées sur le port 443
# C'est ici que se passe tout le vrai travail : servir Angular, proxifier le backend

server {
    listen 443 ssl;
    server_name serveronfire.dev www.serveronfire.dev;

    # ================================
    # Certificats SSL Let's Encrypt
    # ================================
    # Let's Encrypt génère deux fichiers essentiels :
    # - fullchain.pem : le certificat public (présenté au navigateur pour prouver l'identité du serveur)
    # - privkey.pem : la clé privée (utilisée pour chiffrer la communication, ne doit jamais être partagée)
    # Ces fichiers sont montés depuis EC2 via un volume Docker (voir docker-compose.yml)

    ssl_certificate /etc/letsencrypt/live/serveronfire.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/serveronfire.dev/privkey.pem;

    # Protocoles SSL modernes uniquement (TLS 1.2 et 1.3)
    # On désactive les anciennes versions (SSLv3, TLS 1.0, TLS 1.1) qui ont des failles connues
    ssl_protocols TLSv1.2 TLSv1.3;

    # Algorithmes de chiffrement recommandés par Mozilla
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # ================================
    # Headers de sécurité
    # ================================
    # HSTS : force le navigateur à toujours utiliser HTTPS pour ce domaine pendant 1 an
    # Une fois reçu, le navigateur refuse toute connexion HTTP, même si l'utilisateur tape "http://"
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Empêche le site d'être intégré dans une iframe (protection contre le clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Empêche le navigateur de deviner le type MIME des fichiers (protection contre certaines attaques XSS)
    add_header X-Content-Type-Options "nosniff" always;


    root /usr/share/nginx/html;
    index index.html;

    # "root" indique à Nginx le dossier où il va chercher les fichiers à servir.
    # c'est là qu'il va trouver les fichiers Angular compilés.
    # La directive "index", elle, précise la page par défaut quand quelqu'un accède sans spécifier de fichier.
    # Ici, il va servir "index.html", qui est typiquement le point d'entrée de ton application Angular.


    # ================================
    # Compression gzip
    # ================================
    # Réduit la taille des fichiers envoyés au navigateur
    # Un fichier JS de 500 Ko peut descendre à 150 Ko après compression
    # Le navigateur décompresse automatiquement côté client

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;


    # ================================
    # Cache pour les assets statiques
    # ================================
    # Angular génère des fichiers avec un hash dans le nom (ex: main-XBVDSPWN.js)
    # Ce hash change à chaque nouveau build, donc on peut mettre en cache 1 an sans risque
    # Le navigateur garde ces fichiers en local et ne les retélécharge pas à chaque visite

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }


    # ================================
    # Routing Angular (HTML5)
    # ================================
    # Angular gère ses propres routes côté client (/login, /upload, /history...)
    # Sans cette directive, Nginx chercherait un fichier "login" sur le disque et retournerait un 404
    # "try_files" dit : cherche le fichier, sinon le dossier, sinon renvoie index.html
    # Angular reçoit alors index.html et gère lui-même le routing

    location / {
        try_files $uri $uri/ /index.html;
    }


    # ================================
    # Proxy inverse vers le backend Spring Boot
    # ================================
    # Toutes les requêtes /api/* sont redirigées vers le conteneur backend
    # Nginx agit en "proxy inverse", transmettant la requête au backend et renvoyant la réponse.
    # On ajoute des en-têtes HTTP pour garder des infos comme l'adresse IP du client.
    # On ajuste aussi les temps d'attente et la taille maximale des requêtes pour gérer des cas comme des uploads volumineux.
    # En résumé, c'est un pont entre le front et ton backend.
    # "backend" ici est le nom du service Docker, pas localhost
    # Les conteneurs se parlent entre eux par nom de service sur le réseau interne Docker

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout élevé pour les uploads jusqu'à 1 Go
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        client_max_body_size 1g;
    }
}


# ================================
# Améliorations futures possibles
# ================================
# - Rate limiting : limiter le nombre de requêtes par IP pour se protéger des attaques par force brute
# - Fail2ban : bannir automatiquement les IPs qui font trop de tentatives échouées
# - Cache backend : mettre en cache certaines réponses API pour réduire la charge sur Spring Boot
# - Logs d'accès structurés : formater les logs Nginx en JSON pour Loki/Grafana