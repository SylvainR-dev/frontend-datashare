<header class="navbar">
  <div class="navbar-inner">
    <span class="logo">DataShare</span>
    <button class="btn-ghost" routerLink="/login">Se connecter</button>
  </div>
</header>

<main class="page">
  <div class="page-inner">
    <div class="card">
      <h1 class="card-title">Créer un compte</h1>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" formControlName="email" placeholder="Saisissez votre email..." />
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" formControlName="password" placeholder="Saisissez votre mot de passe..." />
        </div>

        <div class="field">
          <label for="confirm">Vérification du mot de passe</label>
          <input type="password" id="confirm" placeholder="Saisissez le à nouveau" />
        </div>

        <a routerLink="/login" class="link">J'ai déjà un compte</a>

        <button type="submit" class="btn-submit">Créer mon compte</button>
      </form>
    </div>
  </div>
</main>
