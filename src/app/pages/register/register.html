<div class="card m-3">
  <h5 class="card-header">Créez votre compte</h5>
  <div class="card-body">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Mail</label>
        <input
          type="text"
          formControlName="email"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && form['email'].errors }"
        />
        @if (submitted && form['email'].errors) {
          <div class="invalid-feedback">
            @if (form['email'].errors?.['required']) {
              <div>email is required</div>
            }
          </div>
        }
      </div>

      <div class="form-group">
        <label>Mot de passe</label>
        <input
          type="password"
          formControlName="password"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && form['password'].errors }"
        />
        @if (submitted && form['password'].errors) {
          <div class="invalid-feedback">
            @if (form['password'].errors?.['required']) {
              <div>password is required</div>
            }
          </div>
        }
      </div>
      <div class="text-center">
        <button class="btn btn-primary mr-1">Valider</button>
        <button class="btn btn-secondary" type="reset" (click)="onReset()">
          Annuler
        </button>
      </div>
    </form>
  </div>
</div>
