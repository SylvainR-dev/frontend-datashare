<header class="navbar">
  <div class="navbar-inner">
    <span class="logo">DataShare</span>
    <button class="btn-ghost" routerLink="/login">Se connecter</button>
  </div>
</header>

<main class="page">
  <div class="page-inner">
    <div class="card">
      <h1 class="card-title">Créer un compte</h1>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" formControlName="email" placeholder="Saisissez votre email..." />
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <div class="input-wrapper">
            <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password" placeholder="Saisissez votre mot de passe..." />
            <button type="button" class="toggle-eye" (click)="showPassword = !showPassword" aria-label="Afficher le mot de passe">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="field">
          <label for="confirm">Vérification du mot de passe</label>
          <div class="input-wrapper">
            <input [type]="showConfirm ? 'text' : 'password'" id="confirm" formControlName="confirmPassword" placeholder="Saisissez le à nouveau" />
            <button type="button" class="toggle-eye" (click)="showConfirm = !showConfirm" aria-label="Afficher le mot de passe">
              <svg *ngIf="!showConfirm" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="showConfirm" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <a routerLink="/login" class="link">J'ai déjà un compte</a>

        <button type="submit" class="btn-submit">Créer mon compte</button>
      </form>
    </div>
  </div>
</main>
