<header class="navbar">
  <div class="navbar-inner">
    <span class="logo">DataShare</span>
    <button class="btn-ghost" routerLink="/register">Créer un compte</button>
  </div>
</header>

<main class="page">
  <div class="page-inner">
    <div class="card">
      <h1 class="card-title">Connexion</h1>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" formControlName="email" placeholder="Saisissez votre email..." />
        </div>

        <div class="field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" formControlName="password" placeholder="Saisissez votre mot de passe..." />
        </div>

        <a routerLink="/register" class="link">Créer un compte</a>

        <button type="submit" class="btn-submit">Connexion</button>
      </form>
    </div>
  </div>
</main>
